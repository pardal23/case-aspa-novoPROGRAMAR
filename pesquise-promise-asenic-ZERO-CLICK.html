<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espiritualidade e Conhecimento Real</title>

<style>
body{
    background-color:#0b0f19;
    color:#ffffff;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    text-align:center;
    padding:20px;
}

h1{
    color:#ff4757;
}

h2{
    color:#2ed573;
    margin-top:30px;
}

p{
    color:#ffa502;
    font-size:1.2rem;
}

.container{
    max-width:800px;
    margin:auto;
    background:#1e272e;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.5);
}

input[type="text"],
input[type="password"]{
    padding:10px;
    width:60%;
    border-radius:5px;
    border:none;
    margin:10px 0;
    font-size:1rem;
    background-color:#2f3542;
    color:white;
}

#resultados{
    margin-top:20px;
    padding:15px;
    background:#2f3542;
    border-left:5px solid #1e90ff;
    text-align:left;
    display:none;
    border-radius:5px;
}

.loading{
    color:#eccc68;
}

#escolhas{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:25px;
    flex-wrap:wrap;
}

.opcao{
    background:#1e90ff;
    color:white;
    padding:15px 25px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
    min-width:180px;
}

.opcao:hover{
    background:#2ed573;
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container" id="demo"></div>

<script>

const demo = document.getElementById("demo");

demo.innerHTML += `
<h1>Espiritualidade hoje.</h1>

<p>
Poema espiritual!<br>
Alma em entrar, viagem no ser<br>
pronto em acontecer.<br>
Sou a Maria espiritual no gosto de viver!
</p>
`;

demo.innerHTML += `
<img
src="https://picsum.photos/500/300"
width="500"
height="300"
style="border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.3);max-width:100%;">
<br><br>
`;

demo.innerHTML += `
Contas da Maria: ${(234 * 45 / 89).toFixed(2)}<br>
Lucro de ontem: ${23 * 12}<br><br>
`;

demo.innerHTML += `<hr style="border:0.5px solid #4b5563;">`;

demo.innerHTML += `
<h2>Faça a sua pesquisa real louca mas insira a passe</h2>

<input
type="password"
id="passwordInput"
placeholder="Insira a palavra-passe aqui...">
<br>

<input
type="text"
id="searchQuery"
placeholder="Ex: inteligência artificial, evolução humana...">
<br>

<div id="escolhas">

    <div class="opcao" data-browser="duck">
        🦆 DuckDuckGo
    </div>

    <div class="opcao" data-browser="maxthon">
        🌐 Maxthon
    </div>

</div>

<div id="resultados"></div>
`;

const resultado = document.getElementById("resultados");

document.addEventListener("mouseover", function(e){

    const opcao = e.target.closest(".opcao");

    if(!opcao) return;

    const password =
        document.getElementById("passwordInput").value.trim();

    const pesquisa =
        document.getElementById("searchQuery").value.trim();

    resultado.style.display = "block";

    if(password !== "cegonha23"){
        resultado.innerHTML =
        "<span style='color:#ff4757;'>❌ Palavra-passe incorreta.</span>";
        return;
    }

    if(!pesquisa){
        resultado.innerHTML =
        "<span style='color:#ff4757;'>⚠️ Introduza algo para pesquisar.</span>";
        return;
    }

    resultado.innerHTML =
    "<span class='loading'>🔎 A preparar pesquisa...</span>";

    let url = "";

    if(opcao.dataset.browser === "duck"){
        url =
        `https://duckduckgo.com/?q=${encodeURIComponent(pesquisa)}`;

        resultado.innerHTML =
        `✅ A abrir pesquisa no DuckDuckGo para: <b>${pesquisa}</b>`;
    }

    if(opcao.dataset.browser === "maxthon"){
        url =
        "https://i.maxthon.com/ru-ru.htm/";

        resultado.innerHTML =
        `✅ A abrir o site oficial do Maxthon.`;
    }

    window.open(url, "_blank");
});

</script>

</body>
</html>
